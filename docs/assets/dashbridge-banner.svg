<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="336" viewBox="0 0 1280 336" role="img" aria-labelledby="title desc">
  <title id="title">DashBridge — Your messages. On your dashboard.</title>
  <desc id="desc">A dark navy banner with the DashBridge wordmark, a cyan bridge symbol, and a diagram connecting a phone to two small boards and a car.</desc>
  <defs>
