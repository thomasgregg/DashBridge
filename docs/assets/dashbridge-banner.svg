<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="384" viewBox="0 0 1280 384" role="img" aria-labelledby="title desc">
  <title id="title">DashBridge — Your messages. On your dashboard.</title>
  <desc id="desc">A dark navy banner with the DashBridge wordmark, a cyan bridge symbol, and a diagram connecting a phone to two small boards and a dashboard. Local Bluetooth. Two ESP32 boards. No SMS forwarding.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#091425"/><stop offset="1" stop-color="#122941"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="1" x2="1" y2="0">
      <stop stop-color="#38bdf8"/><stop offset="1" stop-color="#6ee7d7"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#c6e5ff" stroke-opacity=".035"/>
    </pattern>
  </defs>
  <rect width="1280" height="384" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="384" rx="24" fill="url(#grid)"/>
  <path d="M0 360H1280" stroke="#38bdf8" stroke-opacity=".08"/>
  <g transform="translate(64 58)" fill="none" stroke="url(#accent)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 35H60M9 35V3M51 35V3M9 7C17 29 43 29 51 7M21 24V35M39 24V35"/>
  </g>
  <text x="142" y="87" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" letter-spacing="3" fill="#92b3cf">LOCAL BLUETOOTH BRIDGE</text>
  <text x="60" y="186" font-family="Arial,Helvetica,sans-serif" font-size="76" font-weight="700" letter-spacing="-3" fill="#f3f8ff">DashBridge</text>
  <text x="64" y="233" font-family="Arial,Helvetica,sans-serif" font-size="27" fill="#b8cbde">Your messages. On your dashboard.</text>
  <g font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" letter-spacing=".5">
    <rect x="64" y="287" width="168" height="36" rx="18" fill="#18334a" stroke="#294860"/>
    <circle cx="82" cy="305" r="4" fill="#6ee7d7"/>
