  </defs>
  <rect width="1280" height="336" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="336" rx="24" fill="url(#grid)"/>
  <g transform="translate(64 58)" fill="none" stroke="url(#accent)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
