    <linearGradient id="accent" x1="0" y1="1" x2="1" y2="0">
      <stop stop-color="#38bdf8"/><stop offset="1" stop-color="#6ee7d7"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#c6e5ff" stroke-opacity=".035"/>
