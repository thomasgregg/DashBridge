<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="660" viewBox="0 0 1440 660" role="img" aria-labelledby="title desc">
<title id="title">DashBridge: AZDelivery ESP32 D1 Mini wiring</title>
<desc id="desc">Both boards shown from above, metal module visible and USB sockets at the bottom. Five wires: A GPIO17 to B GPIO16; A GPIO16 to B GPIO17; A GPIO25 to B GPIO26; A GPIO26 to B GPIO25; A GND to B GND. GPIO26 is left inner row, third pin from the top. GPIO25 is right outer row, third. GPIO17, GPIO16 and GND are right inner row, fifth, sixth and seventh. Do not connect the power pins.</desc>
