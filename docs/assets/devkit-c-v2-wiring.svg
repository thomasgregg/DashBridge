<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="660" viewBox="0 0 1440 660" role="img" aria-labelledby="title desc">
<title id="title">DashBridge: AZDelivery ESP32 Dev Kit C V2 wiring</title>
<desc id="desc">Two AZDelivery ESP32 Dev Kit C V2 boards, 38 pins each, viewed from above with USB at bottom. Match the numbered circles: 1 is A GPIO17 to B GPIO16, 2 is A GPIO16 to B GPIO17, 3 is A GPIO25 to B GPIO26, 4 is A GPIO26 to B GPIO25, 5 is GND to GND. GPIO25 is left ninth pin from top; GPIO26 left tenth; selected GND left fourteenth; GPIO17 right eleventh; GPIO16 right twelfth. Disconnect power before wiring. Power each board by USB. Do not connect 5V or 3V3 pins.</desc>
