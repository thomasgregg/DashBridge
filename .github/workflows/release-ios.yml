name: Release iOS app

on:
  push:
    tags:
      - 'ios-v*'

permissions:
  contents: write

jobs:
  release:
    name: Verify app release
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode 26.5
        run: sudo xcode-select -s /Applications/Xcode_26.5.app
      - name: Validate tag and compatibility
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 tools/check_release_versions.py --ios-tag "$RELEASE_TAG"
          python3 tools/check_architecture.py
      - name: Build for the iOS simulator
        run: >-
          xcodebuild
          -project ios/DashBridge.xcodeproj
          -scheme DashBridge
          -sdk iphonesimulator
          -configuration Release
          build
      - name: Run setup-flow tests
        run: >-
          xcodebuild
          -project ios/DashBridge.xcodeproj
          -scheme DashBridge
          -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest'
          -retry-tests-on-failure
          -test-iterations 2
          test
      - name: Publish GitHub release record
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version_build="${RELEASE_TAG#ios-v}"
          version="${version_build%-b*}"
          build="${version_build##*-b}"
          gh release create "$RELEASE_TAG" \
            --title "DashBridge iOS $version (build $build)" \
            --notes-file docs/IOS_RELEASE.md
