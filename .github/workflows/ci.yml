name: CI

on:
  push:
    branches: [main]
    paths:
      - 'firmware/**'
      - 'tools/**'
      - 'tests/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'firmware/**'
      - 'tools/**'
      - 'tests/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:
    inputs:
      board:
        description: 'Build stale images, or force a specific board'
        type: choice
        default: auto
        options: [auto, phone, car, single, both]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Select firmware to build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      roles: ${{ steps.select.outputs.roles }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: select
        env:
          BOARD: ${{ inputs.board || 'auto' }}
        run: python3 tools/build_scope.py "$BOARD" --github-output "$GITHUB_OUTPUT"

  host-tests:
    name: Host protocol tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test with address and undefined-behavior sanitizers
        run: |
          bash tools/test.sh
          python3 tools/test_build_scope.py

  firmware:
    name: ESP32 — ${{ matrix.board }}
    needs: scope
    if: needs.scope.outputs.roles != '[]'
    strategy:
      fail-fast: false
      matrix:
        board: ${{ fromJSON(needs.scope.outputs.roles) }}
    runs-on: ubuntu-24.04
    container: espressif/idf:v5.5.5
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and package selected board
        env:
          BOARD: ${{ matrix.board }}
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          if [[ "$BOARD" == phone ]]; then
            CC=cc python tools/test_audio_codec.py
          fi
          if [[ "$BOARD" == car || "$BOARD" == single ]]; then
            python tools/test_sdp_attributes.py
            python tools/test_acl_recovery.py
            python tools/test_pairing_confirmation.py
          fi
          bash tools/build.sh "$BOARD"
          if [[ "$BOARD" == phone || "$BOARD" == car ]]; then
            DASHBRIDGE_BUILD_ROLE="$BOARD" python tools/test_call_config.py
          fi
          if [[ "$BOARD" == car || "$BOARD" == single ]]; then
            DASHBRIDGE_BUILD_ROLE="$BOARD" python tools/test_sdp.py
            python tools/test_sdp_attributes.py
            python tools/test_acl_recovery.py
            python tools/test_pairing_confirmation.py
          fi
      - name: Preserve experimental firmware
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dashbridge-firmware-${{ matrix.board }}
          path: |
            dist/${{ matrix.board }}-merged.bin
            dist/manifest.json
          if-no-files-found: error
          retention-days: 14
