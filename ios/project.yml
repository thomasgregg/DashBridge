name: DashBridge
options:
  bundleIdPrefix: dev.dashbridge
targets:
  DashBridge:
    type: application
    platform: iOS
    deploymentTarget: "26.4"
    sources:
      - path: App
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: DashBridge
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSBluetoothAlwaysUsageDescription: DashBridge uses Bluetooth to find and set up your bridge.
        NSAccessorySetupKitSupports:
          - Bluetooth
        NSAccessorySetupBluetoothNames:
          - DashBridge
          - Dash Messages
        NSAccessorySetupBluetoothServices:
          - 0D9B6B3D-CEB1-4E16-A0C1-3D28C258A6F0
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    entitlements:
      path: App/App.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.developer.family-controls.app-and-website-usage: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.dashbridge.companion
        DEVELOPMENT_TEAM: BB4MFJBDC7
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
    configFiles:
      Debug: Config/Version.xcconfig
      Release: Config/Version.xcconfig
  DashBridgeUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "26.4"
    sources:
      - path: UITests
    dependencies:
      - target: DashBridge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.dashbridge.companion.uitests
        DEVELOPMENT_TEAM: BB4MFJBDC7
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
  DashBridgeTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.4"
    sources:
      - path: Tests
    dependencies:
      - target: DashBridge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.dashbridge.companion.tests
        DEVELOPMENT_TEAM: BB4MFJBDC7
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
